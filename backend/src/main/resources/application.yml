spring:
  application:
    name: garageflow-backend

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/garageflow}
    username: postgres
    password: 

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
